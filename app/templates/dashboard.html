<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .dashboard-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            text-align: center;
            margin: 0 auto;
            margin-top: 50px;
        }
        .dashboard-container h1 {
            color: #1e293b;
            margin-bottom: 20px;
        }
        .dashboard-container p {
            color: #64748b;
            margin-bottom: 30px;
        }
        .logout-btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #ef4444;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }
        .logout-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>

<body>
    <div style="padding: 20px; width: 100%;">
        <div class="dashboard-container">
            <h1>Bem-vindo(a), {{ data.user.nome if data else current_user.nome }}!</h1>
            <p>Você acessou o sistema com sucesso. Esta é a sua tela inicial provisória.</p>
            <a href="{{ url_for('auth.logout') }}" class="logout-btn">Sair da Plataforma</a>
        </div>
    </div>
</body>
<footer>
    <p>Criado para a disciplina Projeto Integrador I da Universidade Virtual do Estado de São Paulo </p>
</footer>

</html>
